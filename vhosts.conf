

<VirtualHost *:80>
	
	ServerName www.domain1.com

	
	DocumentRoot /var/www/domain1
	
	
	ServerAdmin admin@domain1.com

	
	<Directory "/usr/local/httpd/domain1">
		
		AllowOverride All

		
		Options Indexes FollowSymLinks
		
		
		Order allow,deny

		
		Allow from all
	</Directory>
</VirtualHost>



<VirtualHost *:80>
	
	ServerName www.domain2.com

	
	DocumentRoot /var/www/domain2
	
	
	ServerAdmin admin@domain2.com

	
	<Directory "/usr/local/httpd/domain2">
		
		AllowOverride None

		
		Options None
		
		
		Order deny,allow

		
		Allow from none
	</Directory>
</VirtualHost>


